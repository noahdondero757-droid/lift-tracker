<title>Noah's Training Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: single-column phone app — scoreboard-style condensed headings, data in mono, fixed bottom tab bar */
:root{
  --bg:#EDEFEC; --surface:#FFFFFF; --sunk:#E3E6E2; --ink:#14181B; --muted:#5A645F; --line:#D3D8D3;
  --accent:#1D5C8C; --accent-ink:#FFFFFF; --accent-soft:#DCE8F2;
  --deep:#1B2F55; --rem:#3F7FB5; --light:#A9C6DE; --awake:#C9CEC9;
  --good:#2E7D4F; --warn:#A86A12; --bad:#B5432F;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1113; --surface:#171B1E; --sunk:#1F2428; --ink:#E7EBE9; --muted:#93A09A; --line:#2A3136;
  --accent:#73AADB; --accent-ink:#0A1621; --accent-soft:#1C2E3E;
  --deep:#A9C2F2; --rem:#5C93C8; --light:#2F4A63; --awake:#3A4247;
  --good:#5FBF85; --warn:#E0A845; --bad:#E58069; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1113; --surface:#171B1E; --sunk:#1F2428; --ink:#E7EBE9; --muted:#93A09A; --line:#2A3136;
  --accent:#73AADB; --accent-ink:#0A1621; --accent-soft:#1C2E3E;
  --deep:#A9C2F2; --rem:#5C93C8; --light:#2F4A63; --awake:#3A4247;
  --good:#5FBF85; --warn:#E0A845; --bad:#E58069; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:19px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
section.view{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.plain{padding:0 2px;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;min-height:46px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.small{min-height:36px;padding:7px 12px;font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.neutral{color:var(--muted);background:var(--sunk)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.bar span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}

/* dashboard tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tv{display:flex;align-items:baseline;gap:5px}
.tv .big{font-family:var(--f-display);font-size:42px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tv .unit{font-size:12.5px;color:var(--muted);font-weight:500}
.tsub{font-size:12.5px;color:var(--muted);min-height:1.45em}
.tsub.good{color:var(--good)}.tsub.warn{color:var(--warn)}.tsub.bad{color:var(--bad)}
.spark{width:100%;height:30px;display:block;margin-top:4px}
.tilebtn{display:block;padding:0;border:0;background:none;text-align:left;width:100%;border-radius:14px}
.tilebtn .tile{height:100%}
.tilebtn .tile{position:relative;transition:border-color .15s}
.tilebtn:active .tile{border-color:var(--accent)}
.tmore{position:absolute;top:10px;right:12px;color:var(--muted);font-size:20px;line-height:1}
.tmore.static{position:static;margin-left:auto}
button.vitrow{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
body.locked{overflow:hidden}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.shead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.shead .stitle{flex:1;min-width:0;font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;flex:none}
.sbody{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);border-radius:10px;padding:4px}
.seg button{border:0;background:transparent;border-radius:7px;padding:8px 0;font-weight:600;font-family:var(--f-mono);color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.dread{display:flex;flex-direction:column;gap:2px}
.dread .tv .big{font-size:52px}
.dchartwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px 10px}
.dchart{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}
.dchart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.dhint{font-size:11.5px;color:var(--muted);padding:6px 4px 0}
.dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dstats>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.dstats .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dstats .v{font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.dlist{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:1fr auto 54px;gap:2px 10px;align-items:baseline;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 6px;color:inherit;font:inherit;border-radius:8px}
.drow:first-child{border-top:0}
.drow.on{background:var(--accent-soft)}
.drow .dv{font-weight:600}.drow .dv small{font-weight:500;color:var(--muted);font-size:11px}
.drow .dz{font-size:12.5px;text-align:right;color:var(--muted)}
.drow .dz.good{color:var(--good)}.drow .dz.bad{color:var(--bad)}
.drow .dx{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.drow .dbar{grid-column:1/-1;margin-top:4px}
.drow .dbar .bar{height:6px}
.dabout{font-size:13px;line-height:1.5}
.hrvin{flex:1;min-width:0;font-family:var(--f-mono);font-size:18px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.vitrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13.5px}
.vitrow .mono{flex:1;min-width:0}
.notes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.target{font-size:13px;font-weight:600;color:var(--muted);font-family:var(--f-mono)}
.target.up,.up{color:var(--good);font-weight:600}
/* day picker */
.days{display:grid;grid-template-columns:1fr;gap:10px}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.day .dn{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;color:var(--muted)}
.day.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.next .dn{color:var(--accent)}
.day .meta{font-size:13px;color:var(--muted)}

/* workout */
.block{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.block:first-child{border-top:0;padding-top:0}
.blockhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ex{display:flex;flex-direction:column;gap:8px}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.exname{font-weight:600}
.exnote{font-size:13px;color:var(--muted)}
.sets{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px 8px;align-items:center}
.sets .h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sets .i{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:center}
.sets input{width:100%;min-width:0;font-family:var(--f-mono);font-size:16px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.sets input::placeholder{color:var(--muted);opacity:.6}
.pips{display:flex;gap:8px;flex-wrap:wrap}
.pip{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.pip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pip.add{border-style:dashed;background:transparent}
.check{display:flex;align-items:center;gap:12px;background:none;border:0;padding:4px 0;text-align:left;width:100%}
.box{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;background:var(--sunk)}
.check.on .box{background:var(--accent);border-color:var(--accent)}
.check.on .box::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.textbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:13.5px;padding:4px 0}
textarea,.field input{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
textarea{min-height:70px;resize:vertical}

/* timer */
.timerbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg)}
.timerbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px}
.timerbar .t{font-family:var(--f-mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.timerbar .lbl{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;flex:1;min-width:0}
.timerbar button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:9px;padding:8px 12px;font-weight:600}
.timerbar.flash{background:var(--accent);color:var(--accent-ink)}
.presets{display:flex;gap:8px;flex-wrap:wrap}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* sleep */
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hm{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hm input{font-family:var(--f-mono);font-size:16px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.ranges{display:flex;flex-direction:column;gap:9px}
.range{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.track{position:relative;height:8px;border-radius:4px;background:var(--sunk)}
.track .zone{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-radius:4px}
.track .dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);border:2px solid var(--surface)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .sub{font-size:13px;color:var(--muted)}
.prs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:3px}
.pr .v{font-family:var(--f-mono);font-size:20px;font-weight:600}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:50}
.empty{color:var(--muted);font-size:14px}
.banner{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.pip,.btn,.check .box{transition:background .15s,border-color .15s}}
</style>

<div class="wrap" id="app" aria-live="polite"></div>
<div class="timerbar" id="timer" hidden><div class="in"><div class="t" id="tT">0:00</div><div class="lbl" id="tL"></div><button data-act="stoptimer" type="button">Stop</button></div></div>
<nav class="tabs" aria-label="Sections"><div class="in">

  <button type="button" data-act="tab" data-tab="sleep"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Sleep</button>
  <button type="button" data-act="tab" data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3"/></svg>History</button>
</div></nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" hidden></div>

 {n:1,name:"Lower Power",blocks:[

 {n:3,name:"Lower Strength + Carries",blocks:[
  {label:"Warmup",timer:{label:"3 min bike",ph:[["Bike",180]]},items:[
    {id:"wu_bike",n:"Bike, easy pace",t:"check",note:"3 min"},
    {id:"wu_legfb",n:"Leg swings, front/back",t:"check",note:"15 each leg"},
    {id:"wu_bwsquat",n:"Bodyweight squats",t:"check",note:"2×10"},

let T=null, actx=null;
function beep(f=880,d=.18){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d)}catch{}}
async function startTimer(label,phases,per){

  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch{}

function tick(){
  if(!T)return;

  if(left<=0){
    T.i++; beep(T.i>=T.phases.length?660:880, T.i>=T.phases.length?.5:.18);
    if(T.i>=T.phases.length){$("#tT").textContent="0:00";$("#tL").textContent=T.label+" · done";$("#timer").classList.add("flash");clearInterval(T.h);setTimeout(()=>{if(T&&T.i>=T.phases.length)stopTimer()},2500);return}
    T.end=Date.now()+T.phases[T.i][1]*1000; left=T.phases[T.i][1];
  }
  $("#timer").classList.toggle("flash",left<=3);
  $("#tT").textContent=`${Math.floor(left/60)}:${pad(left%60)}`;
  const ph=T.phases[T.i][0], tot=T.phases.length;
  $("#tL").textContent=tot>T.per?`${ph} · ${Math.floor(T.i/T.per)+1} of ${tot/T.per}`:(T.per>1?ph:T.label);
}
function stopTimer(quiet){if(!T)return;clearInterval(T.h);try{T.lock&&T.lock.release()}catch{}T=null;$("#timer").hidden=true;$("#timer").classList.remove("flash")}

/* ---------- actions ---------- */
function intVal(id){const v=parseInt($("#"+id).value,10);return isFinite(v)?v:0}
async function act(a,el){
  const d=el.dataset;
  if(a!=="discard"&&a!=="delw"&&a!=="delsleep")armed=null;
  switch(a){
    case "tab": tab=d.tab; history.replaceState(null,"","#"+tab); render(); window.scrollTo(0,0); break;
    case "start": if(!draft){draft=newDraft(+d.day);saveDraft()} tab="train"; history.replaceState(null,"","#train"); render(); window.scrollTo(0,0); break;
    case "check": draft.ex[d.id]=draft.ex[d.id]||{done:false}; draft.ex[d.id].done=!draft.ex[d.id].done; saveDraft(); render(); break;
    case "pip": {const r=draft.ex[d.id].rounds;r[+d.i]=!r[+d.i];saveDraft();render();break}
    case "addpip": draft.ex[d.id].rounds.push(false); saveDraft(); render(); break;
    case "addset": {const s=draft.ex[d.id].sets;const l=s[s.length-1]||{w:"",r:""};s.push({w:l.w,r:""});saveDraft();render();break}
    case "preset": startTimer("Rest",[["Rest",+d.s]]); break;
    case "timer": {const b=dayOf(draft.day).blocks[+d.b].timer;let ph=[];for(let i=0;i<(b.rep||1);i++)ph=ph.concat(b.ph);startTimer(b.label,ph,b.ph.length);break}
    case "stoptimer": stopTimer(); break;
    case "detail": detail={k:d.k,range:detail&&detail.k===d.k?detail.range:(["vo2","weight"].includes(d.k)?90:30),sel:null}; render(); $("#sheet").scrollTop=0; break;
    case "closedetail": detail=null; render(); break;
    case "range": detail.range=+d.r; detail.sel=null; render(); break;
    case "pickday": detail.sel=d.d; render(); $("#sheet").scrollTo({top:0,behavior:"smooth"}); break;
    case "savehrv": {
      if(!db){toast("Can't save here. Open the app signed in to claude.ai.");break}
      const v=parseInt($("#hrvIn").value,10); if(!(v>=5&&v<=250)){toast("Enter HRV in ms, like 45");break}
      const ex=vitals.find(x=>x.date===today())||{};
      try{await db.doc("vitals/"+today()).set({...ex,date:today(),hrv:v,hrvSrc:"manual"});$("#hrvIn")&&$("#hrvIn").blur();toast("HRV saved");render()}catch{toast("Couldn't save. Try again.")}
      break}
    case "discard": if(armed==="discard"){draft=null;saveDraft();armed=null;stopTimer();toast("Workout discarded")}else{armed="discard";setTimeout(()=>{if(armed==="discard"){armed=null;render()}},3000)} render(); break;
    case "finish": {
      if(!db){toast("Can't save here. Open the app signed in to claude.ai.");break}
      const rec={day:draft.day,date:draft.date,mins:Math.round((Date.now()-draft.start)/6e4),note:draft.note.trim(),ex:{}};
      for(const [id,e] of Object.entries(draft.ex)){
        if(e.sets){const s=e.sets.filter(x=>x.r!==""||x.w!=="");if(s.length)rec.ex[id]={sets:s}}
        else if(e.rounds){const n=e.rounds.filter(Boolean).length;if(n)rec.ex[id]={rounds:n,of:e.rounds.length}}
        else if(e.done)rec.ex[id]={done:true};
      }
      el.disabled=true;
      try{await db.collection("workouts").add(rec);draft=null;saveDraft();stopTimer();tab="history";history.replaceState(null,"","#history");toast("Workout saved");render();window.scrollTo(0,0)}
      catch(e){el.disabled=false;toast(e&&e.code==="quota_exceeded"?"Storage is full. Delete old sessions first.":"Couldn't save. Check your connection and try again.")}
      break}
    case "delw": if(armed==="w:"+d.id){armed=null;try{await db.doc("workouts/"+d.id).delete();toast("Session deleted")}catch{toast("Couldn't delete. Try again.")}}else{armed="w:"+d.id;render()} break;
    case "delsleep": if(armed==="s:"+d.id){armed=null;try{await db.doc("sleep/"+d.id).delete();toast("Night deleted")}catch{toast("Couldn't delete. Try again.")}}else{armed="s:"+d.id;render()} break;
  }
}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el){e.preventDefault();act(el.dataset.act,el)}});
let saveT;
document.addEventListener("input",e=>{
  const el=e.target; if(!draft||!el.dataset.f)return;
  if(el.dataset.f==="set")draft.ex[el.dataset.id].sets[+el.dataset.i][el.dataset.k]=el.value;
  if(el.dataset.f==="note")draft.note=el.value;
  clearTimeout(saveT); saveT=setTimeout(saveDraft,300);
});

setInterval(()=>{if(tab==="train"&&draft&&!document.activeElement.matches("input,textarea")){/* refresh elapsed minutes */const el=document.querySelector(".view .eyebrow");if(el)el.textContent=`Day ${draft.day} · ${Math.round((Date.now()-draft.start)/6e4)} min`}},30000);

/* ---------- apple health auto-sync ---------- */
let sync={state:"idle",msg:""}, lastSync=0, firstSleep=true;
function rerender(){if(!document.activeElement.matches("input,textarea"))render()}
function syncNoteHTML(){
  const m={idle:"",running:"Syncing from Apple Health…",ok:sync.msg,err:sync.msg,nohost:"Auto-sync from Apple Health runs when you open this inside the Claude app. In Safari, enter nights by hand."}[sync.state];
  return m?`<div class="muted" style="font-size:12.5px">${esc(m)}</div>`:"";
}
async function syncVitals(pick){
  const F=["rhr","hr","hrMin","hrMax","hrv","rr","spo2","steps","vo2","weight"];
  const V={}, get=d=>(V[d]=V[d]||Object.fromEntries([["date",d],...F.map(k=>[k,null])]));
  const res=t=>{const r=pick(t);return (r&&r.result)||{}};
  const stats=t=>res(t).statistics||[], samps=t=>res(t).samples||[];
  const dOf=x=>ymd(new Date(x.period_start));
  const qv=x=>typeof x.value==="number"?x.value:x.value&&(x.value.quantity??x.value.value??x.value.average);
  for(const x of stats("restingHeartRate"))if(x.average!=null)get(dOf(x)).rhr=Math.round(x.average);
  for(const x of stats("heartRate"))if(x.average!=null){const v=get(dOf(x));v.hr=Math.round(x.average);v.hrMin=x.min!=null?Math.round(x.min):null;v.hrMax=x.max!=null?Math.round(x.max):null}
  for(const x of stats("respiratoryRate"))if(x.average!=null)get(dOf(x)).rr=Math.round(x.average*10)/10;
  for(const x of stats("oxygenSaturation"))if(x.average!=null){const a=x.average<=1?x.average*100:x.average;get(dOf(x)).spo2=Math.round(a*10)/10}
  for(const x of stats("stepCount"))if(x.sum!=null)get(dOf(x)).steps=Math.round(x.sum);
  const daily=(t,fn)=>{const acc={};for(const x of samps(t)){const val=qv(x);if(typeof val!=="number")continue;const d=ymd(new Date(x.end||x.start));(acc[d]=acc[d]||[]).push(val)}for(const [d,a] of Object.entries(acc))fn(get(d),a.reduce((m,b)=>m+b,0)/a.length)};
  daily("heartRateVariabilitySDNN",(v,a)=>{v.hrv=Math.round(a);v.hrvSrc="health"});
  daily("vo2Max",(v,a)=>{v.vo2=Math.round(a*10)/10});
  daily("bodyMass",(v,a)=>{v.weight=Math.round(a*2.20462*10)/10});
  const have=Object.fromEntries(vitals.map(v=>[v.date,v]));
  for(const v of Object.values(V)){
    const h=have[v.date];
    if(h){for(const k of F)if(v[k]==null&&h[k]!=null)v[k]=h[k]; if(v.hrvSrc==null&&h.hrvSrc)v.hrvSrc=h.hrvSrc}
    if(h&&F.every(k=>(h[k]??null)===(v[k]??null)))continue;
    await db.doc("vitals/"+v.date).set(v);
  }
}
let fit={state:"idle"};
async function fitbitSync(){
  if(!db||fit.state==="running")return;
  let mcp=null; try{mcp=await window.claude.use("mcp")}catch{}
  if(!mcp)return;
  fit={state:"running"};
  try{
    const r=await mcp.callTool("Google Drive","search_files",{query:"title = 'Training Log – Fitbit Data' and mimeType = 'application/vnd.google-apps.document'",pageSize:1,excludeContentSnippets:true},{cache:false});
    let pl=r.payload; if(typeof pl==="string"){try{pl=JSON.parse(pl)}catch{pl={}}}
    const f=((pl&&pl.files)||[])[0]; if(!f){fit={state:"none"};rerender();return}
    const c=await mcp.callTool("Google Drive","read_file_content",{fileId:f.id},{cache:false});
    const texts=[c.payload&&typeof c.payload.fileContent==="string"?c.payload.fileContent:"",...(c.content||[]).map(b=>{if(!b||!b.text)return "";try{const o=JSON.parse(b.text);return o&&o.fileContent||b.text}catch{return b.text}}),typeof c.payload==="string"?c.payload:""];
    let data=null;
    for(const t of texts){const m=t.match(/===BEGIN===\s*([\s\S]*?)\s*\\?===END===/);if(!m)continue;
      const unmd=m[1].replace(/\\([\[\]_*~`#>|\\-])/g,"$1");
      for(const cand of [m[1],unmd,unmd.replace(/\\"/g,'"')]){try{data=JSON.parse(cand);break}catch{}}
      if(data)break}
    if(!data)throw{code:"parse"};
    let n=0;
    const hrvMap={...(data.hrv||{})};
    for(const [d,rows] of Object.entries(data.debug||{})){
      if(!Array.isArray(rows))continue;
      const pick=rows.find(r=>r[0]!=="apple"&&r[2]>0)||rows.find(r=>r[2]>0);
      if(pick)hrvMap[d]=Math.round(pick[2]);
    }
    for(const [d,v] of Object.entries(hrvMap)){
      if(typeof v!=="number")continue;
      const ex=vitals.find(x=>x.date===d); if(ex&&ex.hrv===v&&ex.hrvSrc==="fitbit")continue;
      await db.doc("vitals/"+d).set({...(ex||{}),date:d,hrv:v,hrvSrc:"fitbit"}); n++;
    }
    fit={state:"ok",n,updated:data.updated,errs:(data.errors||[]).length,days:Object.keys(hrvMap).length};
  }catch(e){fit={state:"err",code:e&&e.code}}
  rerender();
}
function fitNote(){
  if(fit.state==="ok"){const t=fit.updated?new Date(fit.updated).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"";return fit.days?`Linked to Fitbit · updated ${t}`:`Fitbit link found, but no HRV came through yet${fit.errs?" (the link reported an error)":""}.`}
  if(fit.state==="none")return "Fitbit isn't linked yet, so enter HRV by hand.";
  if(fit.state==="err")return fit.code==="server_not_connected"||fit.code==="needs_reauth"?"Reconnect Google Drive in claude.ai Settings → Connectors to read your Fitbit HRV.":"Couldn't read your Fitbit HRV just now. It tries again next time you open the app.";
  return "";
}
async function autoSync(){
  if(sync.state==="running"||!db)return;
  let mcp=null; try{mcp=await window.claude.use("mcp")}catch{}
  if(!mcp){sync={state:"nohost"};rerender();return}
  sync={state:"running"}; lastSync=Date.now(); rerender();
  try{await healthSync(mcp)}finally{fitbitSync()}
}
async function healthSync(mcp){
  const start=new Date(Date.now()-14*864e5); start.setHours(18,0,0,0);
  try{
    const vs=new Date(Date.now()-90*864e5); vs.setHours(0,0,0,0);
    const vr={start_date:vs.toISOString(),end_date:new Date().toISOString()};
    const ls=new Date(Date.now()-180*864e5); ls.setHours(0,0,0,0);
    const lr={start_date:ls.toISOString(),end_date:new Date().toISOString()};
    const res=await mcp.callTool("host:claude-device","health_query_v0",{queries:[
      {sample_type:"sleepAnalysis",query_mode:"samples",sample_limit:1000,date_range:{start_date:start.toISOString(),end_date:new Date().toISOString()}},
      {sample_type:"restingHeartRate",statistics_type:"average",aggregation_interval:"day",date_range:vr},
      {sample_type:"heartRate",statistics_type:"all",aggregation_interval:"day",date_range:vr},
      {sample_type:"heartRateVariabilitySDNN",query_mode:"samples",sample_limit:600,date_range:vr},
      {sample_type:"respiratoryRate",statistics_type:"average",aggregation_interval:"day",date_range:vr},
      {sample_type:"oxygenSaturation",statistics_type:"average",aggregation_interval:"day",date_range:vr},
      {sample_type:"stepCount",statistics_type:"sum",aggregation_interval:"day",date_range:vr},
      {sample_type:"vo2Max",query_mode:"samples",sample_limit:60,date_range:lr},
      {sample_type:"bodyMass",query_mode:"samples",sample_limit:120,date_range:lr}]},{cache:false});
    let p=res.payload; if(typeof p==="string"){try{p=JSON.parse(p)}catch{p={}}}
    const QR=(p&&p.query_results)||[], pick=t=>QR.find(x=>x&&x.sample_type===t);
    const q=pick("sleepAnalysis")||QR[0], samples=(q&&q.result&&q.result.samples)||[];
    try{await syncVitals(pick)}catch{}
    const K={"Asleep (Core)":"light","Asleep (Deep)":"deep","Asleep (REM)":"rem","Awake":"awake","Asleep (Unspecified)":"light","Asleep":"light"};
    const nights={}, segs={};
    for(const s of samples){
      const k=K[s.value&&s.value.category]; if(!k)continue;
      const e=new Date(s.end), eh=e.getHours(); if(eh>=12&&eh<22)continue; // skip daytime naps
      const d=ymd(new Date(e.getTime()+6*36e5)), m=Math.round((e-new Date(s.start))/6e4);
      (nights[d]=nights[d]||{date:d,deep:0,rem:0,light:0,awake:0})[k]+=m;
      (segs[d]=segs[d]||[]).push({k,st:new Date(s.start).getTime(),en:e.getTime()});
    }
    for(const [d,list] of Object.entries(segs)){
      const sl=list.filter(x=>x.k!=="awake"); if(!sl.length)continue;
      const on=Math.min(...sl.map(x=>x.st)), off=Math.max(...sl.map(x=>x.en));
      const mid=list.filter(x=>x.k==="awake"&&x.st>=on&&x.en<=off);
      nights[d].onset=new Date(on).toISOString();
      nights[d].wakeMin=mid.reduce((a,x)=>a+Math.round((x.en-x.st)/6e4),0);
      nights[d].wakes=mid.length;
    }
    const have=Object.fromEntries(sleeps.map(s=>[s.date,s])); let n=0;
    for(const v of Object.values(nights)){
      if(v.deep+v.rem+v.light<60)continue;
      const h=have[v.date]; if(h&&h.deep===v.deep&&h.rem===v.rem&&h.light===v.light&&h.awake===v.awake&&h.onset===v.onset&&h.wakes===v.wakes)continue;
      await db.doc("sleep/"+v.date).set(v); n++;
    }
    sync={state:"ok",msg:n?`Pulled ${n} night${n>1?"s":""} from Apple Health.`:"Up to date with Apple Health."};
  }catch(e){
    const c=e&&e.code;
    if(["server_not_connected","not_granted","capability_disabled","capability_removed"].includes(c))sync={state:"nohost"};
    else if(["not_in_manifest","approval_required","cancelled"].includes(c))sync={state:"err",msg:"Apple Health access wasn't allowed. Reopen the app to be asked again."};
    else sync={state:"err",msg:"Couldn't reach Apple Health just now. It tries again next time you open the app."};
  }
  rerender();
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-lastSync>36e5)autoSync()});

(async()=>{
  try{db=await window.claude?.use?.("db")}catch{db=null}
  if(!db){dbState="off";loaded.w=loaded.s=true;render();return}
  dbState="on";
  db.collection("workouts").orderBy("date","desc").limit(400).onSnapshot(snap=>{
    workouts=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
    loaded.w=true; if(!document.activeElement.matches("input,textarea"))render();
  },()=>{loaded.w=true;render()});
  db.collection("vitals").orderBy("date","desc").limit(200).onSnapshot(snap=>{
    vitals=snap.docs.map(d=>d.data()).filter(x=>x.date); rerender();
  },()=>{});
  db.collection("sleep").orderBy("date","desc").limit(120).onSnapshot(snap=>{
    sleeps=snap.docs.map(d=>d.data()).filter(x=>x.date);
    loaded.s=true; if(!document.activeElement.matches("input,textarea"))render();
    if(firstSleep){firstSleep=false;autoSync()}
  },()=>{loaded.s=true;render()});
})();
